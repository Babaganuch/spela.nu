<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — spela.nu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 1.6rem; margin: 0 0 10px; }
        #hud { font-size: 1.2rem; margin-bottom: 10px; }
        #status { margin-top: 10px; font-size: 1.1rem; min-height: 1.5em; }
        a { color: #4CAF50; }
        #error { color: #ff6b6b; white-space: pre-wrap; max-width: 700px; }
        /* The Phaser canvas is injected here. */
        #phaser-game { margin-top: 5px; }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>Snake</h1>
        <div id="hud">Poäng: <span id="score">0</span></div>
        <div id="phaser-game"></div>
        <div id="status"></div>
        <p><a href="/">&larr; Tillbaka</a></p>
        <div id="error"></div>
    </div>

    <script>
        // Surface any runtime/CDN errors on the page so failures aren't invisible.
        window.addEventListener('error', function (e) {
            document.getElementById('error').textContent += (e.message || e) + '\n';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
        if (typeof Phaser === 'undefined') {
            document.getElementById('error').textContent = 'Phaser kunde inte laddas från CDN.';
        }

        const GRID = 20;
        const COLS = 35;
        const ROWS = 25;
        const WIDTH = GRID * COLS;   // 700
        const HEIGHT = GRID * ROWS;  // 500

        class SnakeScene extends Phaser.Scene {
            constructor() {
                super({ key: 'snake' });
            }

            create() {
                this.snake = [];
                this.direction = { x: 1, y: 0 };
                this.queuedDirection = { x: 1, y: 0 };
                this.score = 0;
                this.gameOver = false;

                var startX = Math.floor(COLS / 5);
                var startY = Math.floor(ROWS / 2);
                for (var i = 0; i < 3; i++) {
                    this.snake.push({ x: startX - i, y: startY });
                }

                this.placeFood();

                // Single Graphics object redrawn each step — no textures needed.
                this.gfx = this.add.graphics();

                this.moveEvent = this.time.addEvent({
                    delay: 200,
                    loop: true,
                    callback: this.step,
                    callbackScope: this
                });

                // Keyboard input via Phaser's input manager.
                this.input.keyboard.on('keydown', (e) => {
                    if (this.gameOver) {
                        if (e.key === ' ' || e.key === 'Enter') this.scene.restart();
                        return;
                    }
                    var d = this.direction;
                    if (e.key === 'ArrowUp' && d.y === 0) this.queuedDirection = { x: 0, y: -1 };
                    else if (e.key === 'ArrowDown' && d.y === 0) this.queuedDirection = { x: 0, y: 1 };
                    else if (e.key === 'ArrowLeft' && d.x === 0) this.queuedDirection = { x: -1, y: 0 };
                    else if (e.key === 'ArrowRight' && d.x === 0) this.queuedDirection = { x: 1, y: 0 };
                });

                this.draw();
            }

            step() {
                if (this.gameOver) return;
                this.direction = this.queuedDirection;
                var head = { x: this.snake[0].x + this.direction.x, y: this.snake[0].y + this.direction.y };

                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { this.endGame(); return; }
                for (var i = 0; i < this.snake.length; i++) {
                    if (this.snake[i].x === head.x && this.snake[i].y === head.y) { this.endGame(); return; }
                }

                this.snake.unshift(head);
                if (head.x === this.foodCell.x && head.y === this.foodCell.y) {
                    this.score += 10;
                    this.placeFood();
                } else {
                    this.snake.pop();
                }
                this.draw();
            }

            placeFood() {
                var x, y, occupied;
                do {
                    x = Phaser.Math.Between(0, COLS - 1);
                    y = Phaser.Math.Between(0, ROWS - 1);
                    occupied = false;
                    for (var i = 0; i < this.snake.length; i++) {
                        if (this.snake[i].x === x && this.snake[i].y === y) { occupied = true; break; }
                    }
                } while (occupied);
                this.foodCell = { x: x, y: y };
            }

            draw() {
                var g = this.gfx;
                g.clear();
                // background
                g.fillStyle(0x111111, 1);
                g.fillRect(0, 0, WIDTH, HEIGHT);
                // food
                g.fillStyle(0xFF5733, 1);
                g.fillCircle(this.foodCell.x * GRID + GRID / 2, this.foodCell.y * GRID + GRID / 2, GRID / 2);
                // snake
                for (var i = 0; i < this.snake.length; i++) {
                    g.fillStyle(i === 0 ? 0x4CAF50 : 0x2E7D32, 1);
                    g.fillRect(this.snake[i].x * GRID, this.snake[i].y * GRID, GRID, GRID);
                }
                var scoreEl = document.getElementById('score');
                if (scoreEl) scoreEl.textContent = this.score;
            }

            endGame() {
                this.gameOver = true;
                this.moveEvent.remove();
                var status = document.getElementById('status');
                if (status) status.textContent = 'Game Over! Poäng: ' + this.score + ' — tryck Mellanslag för att spela igen.';
            }
        }

        var config = {
            type: Phaser.AUTO,
            parent: 'phaser-game',
            width: WIDTH,
            height: HEIGHT,
            backgroundColor: '#111111',
            scene: SnakeScene
        };

        var game = new Phaser.Game(config);
    </script>
</body>
</html>
