<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake — spela.nu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 10px;
        }
        #hud {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        #status {
            margin-top: 10px;
            font-size: 1.1rem;
            min-height: 1.5em;
        }
        a {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Snake</h1>
        <div id="hud">Poäng: <span id="score">0</span></div>
        <div id="status"></div>
        <p><a href="/">&larr; Tillbaka</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/[email protected]/dist/phaser.min.js"></script>
    <script>
        // Standalone Snake game built with Phaser 3, following the official
        // "Making your first Phaser 3 game" structure (preload / create / update).
        // Fully self-contained: no connection to the main page's script.js.

        const GRID = 20;
        const COLS = 35;
        const ROWS = 25;
        const WIDTH = GRID * COLS;   // 700
        const HEIGHT = GRID * ROWS;  // 500

        var snakeScene = {
            preload: function () {
                // Generate a 1x1 white pixel texture to use as the snake/food
                // body, so no external asset files are required.
                var g = this.add.graphics();
                g.fillStyle(0xffffff, 1);
                g.fillRect(0, 0, 1, 1);
                g.generateTexture('pixel', 1, 1);
                g.destroy();
            },

            create: function () {
                this.snake = [];
                this.direction = new Phaser.Math.Vector2(1, 0);
                this.queuedDirection = new Phaser.Math.Vector2(1, 0);
                this.score = 0;
                this.gameOver = false;

                // Restart snake in the middle.
                var startX = Math.floor(COLS / 5);
                var startY = Math.floor(ROWS / 2);
                for (var i = 0; i < 3; i++) {
                    this.snake.push(new Phaser.Math.Vector2(startX - i, startY));
                }

                this.placeFood();

                // Head sprite (drawn on top via depth) plus a body container.
                // We keep it simple: one image per segment, recreated each step.
                this.head = this.add.image(0, 0, 'pixel')
                    .setOrigin(0, 0)
                    .setDisplaySize(GRID, GRID)
                    .setTint(0x4CAF50);
                this.body = this.add.group();

                this.food = this.add.image(0, 0, 'pixel')
                    .setOrigin(0, 0)
                    .setDisplaySize(GRID, GRID)
                    .setTint(0xFF5733);

                // Movement timer — 200ms per step (slower than the old 150ms).
                this.moveEvent = this.time.addEvent({
                    delay: 200,
                    loop: true,
                    callback: this.step,
                    callbackScope: this
                });

                // Keyboard input handled here via Phaser's input manager
                // (the documented best-practice pattern), avoiding any
                // shared-state binding issues.
                this.cursors = this.input.keyboard.createCursorKeys();
                this.input.keyboard.on('keydown', function (e) {
                    if (this.gameOver) {
                        if (e.key === ' ' || e.key === 'Enter') this.scene.restart();
                        return;
                    }
                    var d = this.direction;
                    if (e.key === 'ArrowUp' && d.y === 0) this.queuedDirection.set(0, -1);
                    else if (e.key === 'ArrowDown' && d.y === 0) this.queuedDirection.set(0, 1);
                    else if (e.key === 'ArrowLeft' && d.x === 0) this.queuedDirection.set(-1, 0);
                    else if (e.key === 'ArrowRight' && d.x === 0) this.queuedDirection.set(1, 0);
                }, this);

                this.draw();
            },

            step: function () {
                if (this.gameOver) return;

                // Apply the queued direction (only one turn per step).
                this.direction.copy(this.queuedDirection);

                var head = new Phaser.Math.Vector2(this.snake[0].x, this.snake[0].y);
                head.add(this.direction);

                // Wall collision.
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    this.endGame();
                    return;
                }

                // Self collision.
                for (var i = 0; i < this.snake.length; i++) {
                    if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
                        this.endGame();
                        return;
                    }
                }

                this.snake.unshift(head);

                if (head.x === this.foodCell.x && head.y === this.foodCell.y) {
                    this.score += 10;
                    this.placeFood();
                } else {
                    this.snake.pop();
                }

                this.draw();
            },

            placeFood: function () {
                var x, y, occupied;
                do {
                    x = Phaser.Math.Between(0, COLS - 1);
                    y = Phaser.Math.Between(0, ROWS - 1);
                    occupied = false;
                    for (var i = 0; i < this.snake.length; i++) {
                        if (this.snake[i].x === x && this.snake[i].y === y) { occupied = true; break; }
                    }
                } while (occupied);
                this.foodCell = new Phaser.Math.Vector2(x, y);
                this.food.setPosition(x * GRID, y * GRID);
            },

            draw: function () {
                // Update HUD.
                var scoreEl = document.getElementById('score');
                if (scoreEl) scoreEl.textContent = this.score;

                // Body segments: clear group and re-add one image per segment
                // (skipping the head).
                this.body.clear(true, true);
                for (var i = 1; i < this.snake.length; i++) {
                    var seg = this.snake[i];
                    this.body.create(seg.x * GRID, seg.y * GRID, 'pixel')
                        .setOrigin(0, 0)
                        .setDisplaySize(GRID, GRID)
                        .setTint(0x2E7D32);
                }

                // Head on top.
                this.head.setPosition(this.snake[0].x * GRID, this.snake[0].y * GRID);
            },

            endGame: function () {
                this.gameOver = true;
                this.moveEvent.remove();
                var status = document.getElementById('status');
                if (status) status.textContent = 'Game Over! Poäng: ' + this.score + ' — tryck Mellanslag för att spela igen.';
            }
        };

        var config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: WIDTH,
            height: HEIGHT,
            backgroundColor: '#111111',
            scene: snakeScene
        };

        var game = new Phaser.Game(config);
    </script>
</body>
</html>
